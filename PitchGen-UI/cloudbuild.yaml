// CloudBuildYaml.gs
const CLOUDBUILD_YAML_CONTENT = `
steps:
- id: authenticate-clasp
  name: gcr.io/cloud-builders/gcloud
  entrypoint: 'bash'
  args: ['-c', "gcloud secrets versions access latest --secret=\${_SECRET_ID} --format='get(payload.data)' | tr '_-' '/+' | base64 -d > ~/.clasprc.json" ]  
- id: configure-clasp
  name: gcr.io/cloud-builders/gcloud
  entrypoint: 'bash'
  args: ['-c', 'echo {\\"scriptId\\":\\"\${_SCRIPT_ID}\\"} > .clasp.json' ]  
- id: install-clasp
  name: "gcr.io/cloud-builders/npm"
  entrypoint: 'npm'
  args: ['install', '@google/clasp' ]  
- id: push-code
  name: "gcr.io/cloud-builders/npm"
  entrypoint: 'bash'
  args: ['-c', "npx clasp push -f" ]
- id: deploy-code
  name: "gcr.io/cloud-builders/npm"
  entrypoint: 'bash'
  args: ['-c', "npx clasp deploy" ]  
- id: versions 
  name: "gcr.io/cloud-builders/npm"
  entrypoint: 'bash'
  args: ['-c', "npx clasp deployments" ]
options:
  logging: CLOUD_LOGGING_ONLY
`;

function getCloudBuildConfig() {
  return CLOUDBUILD_YAML_CONTENT;
}
