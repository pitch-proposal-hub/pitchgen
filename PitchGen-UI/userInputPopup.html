    // @mention logic for business_context
    $('#business_context').on('keyup', function(e) {
      var text = $(this).val();
      var cursorPosition = this.selectionStart;
      var textBeforeCursor = text.substring(0, cursorPosition);
      
      // Check if text ends with @ or @something
      var match = textBeforeCursor.match(/@(\w*)$/);
      
      if (match) {
        var query = match[1];
        showMentionDropdown(query);
      } else {
        $('#mentionDropdown').hide();
      }
    });

    // Close dropdown on click outside
    $(document).on('click', function(e) {
      if (!$(e.target).closest('#mentionDropdown').length && !$(e.target).closest('#business_context').length) {
        $('#mentionDropdown').hide();
      }
    });
  });

  function insertMention(fileId, fileTitle, fileType) {
    var textarea = $('#business_context')[0];
    var text = textarea.value;
    var cursorPosition = textarea.selectionStart;
    var textBeforeCursor = text.substring(0, cursorPosition);
    var textAfterCursor = text.substring(cursorPosition);
    
    var atIndex = textBeforeCursor.lastIndexOf('@');
    
    if (atIndex !== -1) {
      var newText = textBeforeCursor.substring(0, atIndex) + '@' + fileTitle + ' ' + textAfterCursor;
      textarea.value = newText;
      
      var newCursorPosition = atIndex + fileTitle.length + 2; // @ + title + space
      textarea.selectionStart = newCursorPosition;
      textarea.selectionEnd = newCursorPosition;
      
      // Store File ID for backend
      $('#selectedDriveFileId').val(fileId);
      $('#selectedDriveFileType').val(fileType);
      $('#selectedDriveFileTitle').val(fileTitle);
      
      textarea.focus();
    }
    
    $('#mentionDropdown').hide();
  }

function generate_Pitch(){

function secondFormLoad()
{

function dragStart() {
  dragItem = this;
  setTimeout(() => {
    this.style.display = 'none';
  }, 0);
}
function dragEnd() {
  dragItem.style.display = 'flex';
  dragItem = null;
}
document.addEventListener('dragover', e => {
  e.preventDefault();
  const afterElement = getDragAfterElement(e.clientY);
  const container = document.getElementById('container');
  const draggable = document.querySelector('.draggable-input');
  if (afterElement == null) {
    container.appendChild(dragItem);
  } else {
    container.insertBefore(dragItem, afterElement);
  }
});

function getDragAfterElement(y) {
  const draggableElements = [...document.querySelectorAll('.draggable-input:not(.dragging)')];

  return draggableElements.reduce((closest, child) => {
    const box = child.getBoundingClientRect();
    const offset = y - box.top - box.height / 2;
    if (offset < 0 && offset > closest.offset) {
      return { offset: offset, element: child };
    } else {
      return closest;
    }
  }, { offset: Number.NEGATIVE_INFINITY }).element;
}

function promptLoad(id)                 //Step 2: This method will execute only for 1 time either on page reload or api failed time 
{
  const refreshIcon = document.getElementById(id);
  refreshIcon.style.display = "inline-block";                   //Spinning rotate icon based on the id
  refreshIcon.style.animation = "spin 1s linear infinite";

  google.script.run.withSuccessHandler(function(arg){
    
    if(arg.status == false)
    {
      refreshIcon.style.display = "";                             //Removing rotation of rotate icon
      refreshIcon.style.animation = "";

      document.getElementById("refresh-icon-success").style.display = "none";
      document.getElementById("refresh-icon-fail").style.display = "block";

      document.getElementById("prompt0").innerHTML = 'Failed';              //Showing failed prompts
      document.getElementById("prompt1").innerHTML = 'Failed';
      document.getElementById("prompt2").innerHTML = 'Failed';
    }
    else
    {
      //const keys = Object.keys(arg.prompts);
      const keys = arg.keys;
      var currentIndex = 0;
      for(var i=promptNode; i<keys.length && currentIndex<3; i++)           //Only printing 3 prompt at a time
      {
        document.getElementById("prompt"+currentIndex).innerHTML = keys[i];
        document.getElementById("quickButton"+currentIndex).setAttribute("onclick", 'promptSelected('+currentIndex+',"'+arg.prompts[keys[i]]+'")');

        currentIndex++;
        promptNode++;
        if((i+1) == keys.length)               //if promptNode reach to the last value then start re-printing from first key value
        {
          i = -1;                                   // i=-1 because, once i++ statement will execute it will increment the index value of i=0
          promptNode = 0;                           //Reseting the current node of prompt array
        }
      }
      promptObject = arg.prompts;
      promptKeys = keys;
      refreshIcon.style.display = "";                             //Removing rotation of rotate icon
      refreshIcon.style.animation = "";

      document.getElementById("refresh-icon-fail").style.display = "none";
      document.getElementById("refresh-icon-success").style.display = "block";
    }
  }).promptLoad();
}

  input.value = input.value.replace(/\D/g, '');
}
