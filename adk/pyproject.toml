[project]
name = "pitchgen-multiagent"
version = "0.1.0"
description = ""
authors = [
    {name = "Your Name", email = "your@email.com"},
]
dependencies = [
    "google-adk[agent-identity,a2a]>=2.8.0",
    "a2a-sdk>=1.1.0",
    "opentelemetry-instrumentation-google-genai>=0.1.0,<1.0.0",
    "grpcio>=1.83.0",
    "gcsfs>=2024.11.0",
    "google-cloud-logging>=3.12.0,<4.0.0",
    "google-cloud-aiplatform[evaluation,agent-engines]>=1.157.0",
    "protobuf>=6.31.1,<7.0.0",
    "google-cloud-discoveryengine>=0.13.15",
    "google-cloud-secret-manager",
    "google-genai>=2.20.0",
    "numpy",
    "configparser",
    "google-cloud-translate",
    "google-cloud-storage",
    "PyMySQL",
    "SQLAlchemy",
    "cloud-sql-python-connector",
    "fuzzywuzzy",
    "python-Levenshtein",
    "google-api-python-client",
    "python-dotenv",
    "faiss-cpu",
    "fastapi",
    "pydantic",
    "thefuzz",
    "opentelemetry-instrumentation-httpx",
    "opentelemetry-instrumentation-grpc",
    "pillow",
]
requires-python = "==3.12.*"


[dependency-groups]
dev = [
    "pytest>=9.0.2,<10.0.0",
    "pytest-asyncio>=1.0.0,<2.0.0",
    "nest-asyncio>=1.6.0,<2.0.0",
]

[project.optional-dependencies]
eval = [
    "google-adk[eval]>=2.0.0a0",
    "google-cloud-aiplatform[evaluation]>=1.150.0",
]
lint = [
    "ruff>=0.4.6,<1.0.0",
    "ty>=0.0.1a0",
    "codespell>=2.2.0,<3.0.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "C",  # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP", # pyupgrade
    "RUF", # ruff specific rules
]
ignore = ["E501", "C901", "B006"] # ignore line too long, too complex

[tool.ruff.lint.isort]
known-first-party = ["app", "frontend"]

[tool.ty]
# ty is Astral's Rust-based type checker (same team as ruff/uv)
# See: https://docs.astral.sh/ty/

[tool.ty.environment]
python-version = "3.10"

[tool.ty.src]
exclude = [".venv/**"]

[tool.ty.rules]
# Ignore common issues with third-party libraries and dynamic code patterns
unresolved-import = "ignore"
unresolved-attribute = "ignore"
invalid-argument-type = "ignore"
invalid-assignment = "ignore"
invalid-return-type = "ignore"
possibly-missing-attribute = "ignore"
not-subscriptable = "ignore"
deprecated = "ignore"

[tool.codespell]
ignore-words-list = "rouge"
skip = "./locust_env/*,uv.lock,.venv,./frontend,**/package-lock.json"




[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.pytest.ini_options]
pythonpath = "src"
asyncio_default_fixture_loop_scope = "function"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.uv]
environments = ["sys_platform == 'linux'"]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.hatch.metadata]
allow-direct-references = true
#[tool.uv.sources]
#google-adk = { path = "./src/google-adk" }
