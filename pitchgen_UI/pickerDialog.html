<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Select File</title>
  <script src="https://apis.google.com/js/api.js"></script>
  <script src="//cdn.jsdelivr.net/npm/alertifyjs@1.14.0/build/alertify.min.js"></script>
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/alertifyjs@1.14.0/build/css/alertify.min.css"/>
  <style>
    html, body {
      background: transparent !important;
      margin: 0;
      padding: 15px;
      overflow: hidden;
      height: 100%;
      width: 100%;
      box-sizing: border-box;
    }
  </style>
</head>
<body>
  <div style="text-align: center; margin-top: 20%;">
    <p id="statusMessage"></p>
  </div>

  <script>
    var pickerApiLoaded = false;
    var oauthToken = null;

    // Load the Google Picker API on document load
    gapi.load('picker', {'callback': onPickerApiLoad});
    
    google.script.run.withSuccessHandler(function(token) {
      oauthToken = token;
      openDrivePicker();
    }).getOAuthToken();

    function onPickerApiLoad() {
      pickerApiLoaded = true;
      openDrivePicker();
    }

    function openDrivePicker() {
      if (!pickerApiLoaded || !oauthToken) {
        return; // Wait until both are loaded
      }

      google.script.run.withSuccessHandler(function(devKey) {
        var view = new google.picker.View(google.picker.ViewId.DOCS);
        view.setMimeTypes("application/vnd.google-apps.document,application/vnd.google-apps.presentation");

        var builder = new google.picker.PickerBuilder()
            .enableFeature(google.picker.Feature.NAV_HIDDEN)
            .setOAuthToken(oauthToken)
            .addView(view)
            .setCallback(pickerCallback)
            .setTitle("Select a Google Doc or Slide for context")
            .setOrigin(google.script.host.origin)
            .setSize(770, 530);

        if (devKey && devKey !== "YOUR_API_KEY_HERE" && devKey.trim() !== "") {
          builder.setDeveloperKey(devKey);
        }

        try {
          var picker = builder.build();
          picker.setVisible(true);
          document.getElementById("statusMessage").style.display = "none";
        } catch (pickerErr) {
          console.error("Error building Google Picker: ", pickerErr);
          alertify.error("Could not load Google Picker. Please try Local Upload or @mention.");
          document.getElementById("statusMessage").innerText = "Could not load Picker. Please select files via @mention or Local Upload.";
        }
      }).getDeveloperKey();
    }

    function pickerCallback(data) {
      if (data[google.picker.Response.ACTION] === google.picker.Action.PICKED) {
        var doc = data[google.picker.Response.DOCUMENTS][0];
        var fileId = doc[google.picker.Document.ID];
        var fileTitle = doc[google.picker.Document.NAME];
        var fileType = doc[google.picker.Document.MIME_TYPE];

        // Save the selection to server-side CacheService
        google.script.run.withSuccessHandler(function() {
          google.script.host.close(); // Close this dialog
        }).storeSelectedFile(fileId, fileTitle, fileType);
      } else if (data[google.picker.Response.ACTION] === google.picker.Action.CANCEL) {
        google.script.host.close();
      }
    }
  </script>
</body>
</html>
