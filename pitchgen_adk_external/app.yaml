runtime: python311
service: your-appengine-service-name
instance_class: F4_1G

inbound_services:
  - warmup

automatic_scaling:
  min_instances: 1
  min_idle_instances: 1
  max_pending_latency: 1s
  target_cpu_utilization: 0.65

entrypoint: gunicorn -w 4 -k uvicorn.workers.UvicornWorker -t 3000 main:app